name: Build ZRoom Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repository'yi Klonla
      uses: actions/checkout@v4

    - name: Java 21 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: ApexClans Yerel Jar Dosyasını Maven'a Yükle
      run: |
        mvn install:install-file \
          -Dfile=libs/ApexClans.jar \
          -DgroupId=net.sacredcraft \
          -DartifactId=apexclans \
          -Dversion=1.0 \
          -Dpackaging=jar

    - name: Maven ile Derle
      run: mvn clean package --file pom.xml

    - name: JAR Dosyasını Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: ZRoom-Plugin
        path: target/*.jar
        
